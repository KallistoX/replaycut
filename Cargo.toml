[workspace]
resolver = "2"
members = ["crates/replaycut", "tests/api"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/KallistoX/replaycut"
rust-version = "1.85"

[workspace.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

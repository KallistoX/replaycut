[package]
name = "replaycut"
description = "Clip manager for the OBS replay buffer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

build = "build.rs"

[[bin]]
name = "replaycut"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
anyhow = "1.0.104"
base64 = "0.22"
argon2 = { version = "0.5", features = ["std"] }
arboard = { version = "3.6.1", default-features = false }
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.5.61", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
notify = "8.2.0"
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
minisign-verify = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "io-util", "signal"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }
trash = "5.2.3"

[target."cfg(windows)".dependencies]
muda = { version = "0.19", default-features = false }
tray-icon = { version = "0.24", default-features = false }
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "UI_Notifications", "Data_Xml_Dom", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Storage_EnhancedStorage", "Win32_Devices_FunctionDiscovery", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_ProcessStatus"] }
winreg = "0.56"

[target."cfg(windows)".build-dependencies]
winresource = "0.1"

[dev-dependencies]
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }

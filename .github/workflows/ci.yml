# CI skeleton. Builds and lints the workspace; the API contract tests need a
# running service and are therefore only compiled here, not executed.
# The release workflow (release.yml) runs on tags v*.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - name: Compile API tests (not run - they need a live service)
        run: cargo test --workspace --no-run

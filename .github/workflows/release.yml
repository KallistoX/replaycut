# Release: on a tag v<version>, build the Windows executable and the static
# Linux executable, pack one ZIP per platform with the files of the release
# package, write one SHA256SUMS for both and publish a GitHub release whose
# notes are that version's section of CHANGELOG.md. The signature
# (SHA256SUMS.minisig) is added by hand afterwards, see dist/sign-release.ps1.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The Google clients the release carries for YouTube (see
  # wardogs/infra/google). Repository variables, not secrets: a client of an
  # installed application is public by design, it only stays out of the
  # source so that a fork does not upload under this app. A fork - or this
  # repository before the variables are set - simply builds without a
  # built-in client, and the card says so.
  REPLAYCUT_YOUTUBE_TV_CLIENT_ID: ${{ vars.REPLAYCUT_YOUTUBE_TV_CLIENT_ID }}
  REPLAYCUT_YOUTUBE_TV_CLIENT_SECRET: ${{ vars.REPLAYCUT_YOUTUBE_TV_CLIENT_SECRET }}
  REPLAYCUT_YOUTUBE_DESKTOP_CLIENT_ID: ${{ vars.REPLAYCUT_YOUTUBE_DESKTOP_CLIENT_ID }}
  REPLAYCUT_YOUTUBE_DESKTOP_CLIENT_SECRET: ${{ vars.REPLAYCUT_YOUTUBE_DESKTOP_CLIENT_SECRET }}

jobs:
  build:
    name: Build ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x64
            target: ""
          - os: ubuntu-latest
            suffix: linux-x64
            # static: one file that runs on any distribution
            target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Check that the tag matches the workspace version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Build
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p replaycut

      - name: Build (static)
        if: runner.os == 'Linux'
        run: |
          # The runner image carries third-party sources (Chrome, ...) whose index
          # breaks now and then; a stale one costs us nothing, the install below is
          # what has to work.
          sudo apt-get update || sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends musl-tools
          cargo build --release --locked -p replaycut --target ${{ matrix.target }}
          file target/${{ matrix.target }}/release/replaycut

      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          $pkg = "replaycut-$version-${{ matrix.suffix }}"
          New-Item -ItemType Directory "$pkg\ui" | Out-Null
          Copy-Item target\release\replaycut.exe, dist\install.cmd, dist\uninstall.cmd, README.md, LICENSE, CHANGELOG.md $pkg
          Copy-Item ui\index.html "$pkg\ui"
          Compress-Archive -Path "$pkg\*" -DestinationPath "$pkg.zip"

      - name: Package
        if: runner.os == 'Linux'
        run: |
          version=${GITHUB_REF_NAME#v}
          pkg="replaycut-$version-${{ matrix.suffix }}"
          mkdir -p "$pkg/ui"
          cp target/${{ matrix.target }}/release/replaycut dist/install.sh dist/uninstall.sh README.md LICENSE CHANGELOG.md "$pkg"
          cp ui/index.html "$pkg/ui"
          # for distribution packages: the desktop entry and user unit for
          # /usr/bin/replaycut, and the icon (see README, "Packaging")
          cp dist/linux/replaycut.desktop dist/linux/replaycut.service crates/replaycut/assets/replaycut.svg "$pkg"
          chmod +x "$pkg/replaycut" "$pkg/install.sh" "$pkg/uninstall.sh"
          (cd "$pkg" && zip -r "../$pkg.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.suffix }}
          path: replaycut-*.zip
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true

      # One line per ZIP, `<sha256>  <name>`: what the updater reads and what
      # dist/sign-release.ps1 signs.
      - name: SHA256SUMS
        run: |
          sha256sum replaycut-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '/^## \[/ { p = (index($0, "## [" v "]") == 1) } /^\[/ { p = 0 } p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "replaycut $version" > notes.md; fi
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            replaycut-*.zip
            SHA256SUMS

[package]
name = "replaycut-api-tests"
description = "Black-box contract tests for the replaycut HTTP API (run against any implementation via BASE_URL)"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# `rustls-tls` so the suite can run against a service with HTTPS on (since
# 3.4) and trust its certificate authority through `TLS_CA`.
reqwest = { workspace = true, features = ["rustls-tls"] }
serde_json.workspace = true
